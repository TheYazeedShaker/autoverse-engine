name: Smoke (post-deploy)

# Runs after every successful PRODUCTION deploy that Vercel reports to GitHub. It proves the new
# commit is actually live on the public production domain, then checks health and that a host with
# no brand fails closed: the production vercel.app address has no brand domain yet, so "/" must be
# the brand-neutral 404 (spec §2), not a showroom.
# (GitHub runs deployment_status workflows from the default branch's copy of this file.)
on: deployment_status

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public production domain. Per-deployment and preview URLs sit behind Vercel login.
      PROD_URL: https://autoverse-engine-consumer.vercel.app
      EXPECTED_SHA: ${{ github.event.deployment.sha }}
    steps:
      - name: Wait until production serves this exact commit
        run: |
          for i in $(seq 1 30); do
            sha=$(curl -fsS --max-time 10 "$PROD_URL/api/health" | jq -r '.sha // empty' 2>/dev/null || true)
            if [ "$sha" = "$EXPECTED_SHA" ]; then echo "Live on production: $sha"; exit 0; fi
            echo "attempt $i: production is serving '${sha:-no answer}', waiting for $EXPECTED_SHA"
            sleep 10
          done
          echo "::error::Production never served $EXPECTED_SHA within 5 minutes."
          exit 1

      - name: Smoke — health endpoint reports this commit
        run: |
          curl -fsS --max-time 10 "$PROD_URL/api/health" \
            | jq -e --arg sha "$EXPECTED_SHA" '.status == "ok" and .sha == $sha'

      # No brand is mapped to this host, so the showroom at "/" must answer 404 with the brand-neutral
      # page. That is the tenancy rule working, not an error. A 200 would mean an unknown host
      # rendered a brand; a 5xx would mean the page itself broke.
      - name: Smoke — an unknown host gets the brand-neutral 404
        run: |
          code=$(curl -sS --max-time 10 -o page.html -w '%{http_code}' "$PROD_URL/")
          [ "$code" = "404" ] || { echo "::error::Unknown host returned HTTP $code on / (expected 404)"; exit 1; }
          grep -q "Page not found" page.html || { echo "::error::The 404 page did not render"; exit 1; }
          if grep -q "data-showroom" page.html; then echo "::error::An unknown host rendered a showroom"; exit 1; fi
          echo "Smoke OK: $PROD_URL is healthy on $EXPECTED_SHA and fails closed for an unknown host"

      # When a real brand domain exists, add a step that GETs it and expects 200 with <main
      # data-showroom="<slug>">, so the smoke test also proves a brand page renders.

      # Auto-rollback (CLAUDE.md build loop) needs a Vercel token as a repo secret, which this repo
      # does not have yet. Until then a failed smoke fails loudly here and GitHub notifies.
